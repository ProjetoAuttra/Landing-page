<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      *{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#0c1730;background:radial-gradient(circle at 70% 5%,#dce8ff,transparent 40%),#f7f9fc}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(29,78,216,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(29,78,216,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,#000,transparent 80%)}main{position:relative;width:1040px}.brand{display:flex;align-items:center;gap:17px;color:#1d4ed8;font-size:36px;font-weight:850;letter-spacing:-.05em}.brand img{width:58px;height:58px}.eyebrow{margin-top:65px;color:#1d4ed8;font-size:17px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{max-width:1000px;margin:18px 0 0;font-size:78px;line-height:.94;letter-spacing:-.06em}h1 span{color:#1d4ed8}.foot{display:flex;align-items:center;gap:18px;margin-top:38px;color:#66758d;font-size:21px}.arrow{width:130px;height:3px;background:#1d4ed8;clip-path:polygon(0 30%,90% 30%,90% 0,100% 50%,90% 100%,90% 70%,0 70%)}
    </style>
    <title>Auttra Social Card</title>
  </head>
  <body><div class="grid"></div><main><div class="brand"><img src="/favicon.svg" alt="" />Auttra</div><div class="eyebrow">Gestão web e mobile para oficinas</div><h1>Direção para a gestão.<br><span>Ritmo para a oficina.</span></h1><div class="foot"><div class="arrow"></div>Veja o próximo passo com mais clareza.</div></main></body>
</html>
